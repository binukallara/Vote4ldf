<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Voting Machine - Malik Mankode</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d94;
            --primary-blue: #2b5c8f;
            --ldf-red: #e63946;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Malayalam', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Premium Machine Container */
        .machine-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
            position: relative;
            z-index: 10;
        }

        .machine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .ready-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .green-light {
            width: 12px;
            height: 12px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 10px #00e676;
            animation: pulse-green 2s infinite;
        }

        .ballot-title {
            font-weight: 700;
            color: #555;
            font-size: 14px;
        }

        /* Candidate Row */
        .candidate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .candidate-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .serial-number {
            font-weight: 700;
            font-size: 18px;
            color: #333;
        }

        .candidate-details {
            display: flex;
            flex-direction: column;
        }

        .candidate-name {
            font-weight: 700;
            font-size: 16px;
            color: #222;
        }

        .party-symbol {
            font-size: 20px;
            margin-top: 2px;
        }

        /* Vote Button */
        .vote-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .vote-button {
            width: 70px;
            height: 40px;
            background: var(--primary-blue);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 15px rgba(43, 92, 143, 0.4);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vote-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(43, 92, 143, 0.6);
        }

        .vote-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(43, 92, 143, 0.4);
        }

        .red-light {
            width: 14px;
            height: 14px;
            background-color: #555;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .red-light.active {
            background-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
            animation: pulse-red 1s infinite;
        }

        /* Result Section (Video & Share) */
        .result-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 20px;
        }

        .result-section.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .video-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 15px;
        }

        .share-container {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .share-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-whatsapp { background: #25D366; }
        .btn-facebook { background: #1877F2; }
        .btn-twitter { background: #1DA1F2; }

        /* Animations */
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 230, 118, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="machine-container" id="votingMachine">
        <!-- Header -->
        <div class="machine-header">
            <div class="ready-indicator">
                Ready <span class="green-light"></span>
            </div>
            <div class="ballot-title">Ballot Unit</div>
        </div>

        <!-- Candidate Row -->
        <div class="candidate-row">
            <div class="candidate-info">
                <span class="serial-number">2</span>
                <div class="candidate-details">
                    <span class="candidate-name">സ. മാലിക് മാങ്കോട്</span>
                    <span class="party-symbol">🌾 (LDF)</span>
                </div>
            </div>
            
            <div class="vote-btn-wrapper">
                <button class="vote-button" id="voteBtn">
                    <span class="red-light" id="voteLight"></span>
                </button>
            </div>
        </div>

        <!-- Result Section (Hidden initially) -->
        <div class="result-section" id="resultSection">
            <div class="video-container">
                <!-- ഇവിടെ താങ്കളുടെ വീഡിയോയുടെ ലിങ്ക് നൽകുക -->
                <video id="campaignVideo" controls playsinline>
                    <source src="YOUR_VIDEO_URL_HERE.mp4" type="video/mp4">
                    <!-- YouTube വീഡിയോ ആണെങ്കിൽ താഴെയുള്ള iframe ഉപയോഗിക്കാം -->
                    <!-- <iframe width="100%" height="200" src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe> -->
                    നിങ്ങളുടെ ബ്രൗസർ വീഡിയോ സപ്പോർട്ട് ചെയ്യുന്നില്ല.
                </video>
            </div>

            <div class="share-container">
                <div class="share-title">നിങ്ങളുടെ പിന്തുണ സുഹൃത്തുക്കളുമായി പങ്കുവെക്കൂ!</div>
                <div class="share-buttons">
                    <a href="https://api.whatsapp.com/send?text=ഞാൻ സ. മാലിക് മാങ്കോടിന് വോട്ട് ചെയ്തു! നിങ്ങളും LDF-നെ പിന്തുണക്കൂ. #VoteForLDF #MalikMankode" target="_blank" class="share-btn btn-whatsapp">
                        WhatsApp
                    </a>
                    <a href="https://www.facebook.com/sharer/sharer.php?u=https://your-website.com" target="_blank" class="share-btn btn-facebook">
                        Facebook
                    </a>
                    <a href="https://twitter.com/intent/tweet?text=ഞാൻ സ. മാലിക് മാങ്കോടിന് വോട്ട് ചെയ്തു! #VoteForLDF" target="_blank" class="share-btn btn-twitter">
                        X (Twitter)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const voteBtn = document.getElementById('voteBtn');
            const voteLight = document.getElementById('voteLight');
            const votingMachine = document.getElementById('votingMachine');
            const resultSection = document.getElementById('resultSection');
            const campaignVideo = document.getElementById('campaignVideo');
            let hasVoted = false;

            voteBtn.addEventListener('click', () => {
                if (hasVoted) return;
                hasVoted = true;

                // 1. Visual feedback on the voting machine
                voteLight.classList.add('active');
                voteBtn.style.transform = 'scale(0.95)';
                
                // Disable button to prevent multiple clicks
                voteBtn.style.pointerEvents = 'none';
                
                // 2. Add a slight delay to simulate the voting process
                setTimeout(() => {
                    // Fade out the voting machine slightly
                    votingMachine.classList.add('fade-out');
                    
                    setTimeout(() => {
                        votingMachine.style.display = 'none';
                        
                        // 3. Show the result section (Video + Share buttons)
                        resultSection.style.display = 'block';
                        
                        // Trigger reflow to ensure transition works
                        void resultSection.offsetWidth; 
                        resultSection.classList.add('show');

                        // 4. Auto-play the video (muted to bypass browser autoplay restrictions)
                        if(campaignVideo) {
                            campaignVideo.muted = true; 
                            campaignVideo.play().catch(error => {
                                console.log("Autoplay was prevented by the browser. User needs to click play.", error);
                            });
                        }

                    }, 500); // Wait for fade out to finish

                }, 800); // Wait to simulate machine processing
            });
        });
    </script>

</body>
</html>
